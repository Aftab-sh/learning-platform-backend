spring.application.name=learningplatform

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
#jwt.expiration=  ${jwt_expiration}


# Judge0
judge0.api.url=https://ce.judge0.com/submissions
# Mail
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=CodeLearn

# URLs
app.frontend-url=${FRONTEND_URL}
app.base-url=${APP_BASE_URL}

# AI (Gemini via Spring AI OpenAI-compatible client)
spring.ai.model.chat=openai
spring.ai.openai.api-key=${GCP_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.model=${AI_MODEL:gemini-2.5-flash}